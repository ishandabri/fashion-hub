server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}

